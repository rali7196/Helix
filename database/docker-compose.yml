services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: example123
      POSTGRES_DB: helix
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data 
    ports:
      - "5432:5432"
 
volumes:
  pgdata:

networks:
  helix-network:
    external:
      true